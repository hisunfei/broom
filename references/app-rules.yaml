# Broom 应用清理规则 v2.1
# 精细化规则：区分缓存、数据、授权信息

apps:
  # === 即时通讯 ===
  - name: "微信"
    bundle_id: "com.tencent.xinWeChat"
    process_name: "WeChat"
    cache_dirs:
      - "~/Library/Containers/com.tencent.xinWeChat/Data/Library/Caches"
      - "~/Library/Containers/com.tencent.xinWeChat/Data/Library/Application Support/radium"
    data_dirs:
      - "~/Library/Containers/com.tencent.xinWeChat/Data/Documents"
    protected:
      - "*.db"
      - "*.sqlite"
      - "config"
      - "token"
      - "credentials"
      - "mmkv"
    risk_level: "data"  # 聊天记录是重要数据

  - name: "企业微信"
    bundle_id: "com.tencent.WeWorkMac"
    process_name: "WeWorkMac"
    cache_dirs:
      - "~/Library/Containers/com.tencent.WeWorkMac/Data/Library/Caches"
    data_dirs:
      - "~/Library/Containers/com.tencent.WeWorkMac/Data/Documents"
    protected:
      - "*.db"
      - "*.sqlite"
      - "config"
      - "token"
      - "credentials"
    risk_level: "data"

  - name: "飞书"
    bundle_id: "com.electron.lark"
    process_name: "Lark"
    cache_dirs:
      - "~/Library/Containers/com.electron.lark/Data/Library/Caches"
      - "~/Library/Containers/com.electron.lark/Data/Library/Application Support/cache"
    data_dirs:
      - "~/Library/Containers/com.electron.lark/Data/Documents"
    protected:
      - "*.db"
      - "*.sqlite"
      - "config"
      - "token"
      - "credentials"
      - "auth"
      - "keyring"
    risk_level: "data"
    notes: "飞书的授权信息在 ~/.local/share/keyrings，绝对不能删除"

  - name: "钉钉"
    bundle_id: "com.alibaba.DingTalkMac"
    process_name: "DingTalk"
    cache_dirs:
      - "~/Library/Containers/com.alibaba.DingTalkMac/Data/Library/Caches"
    data_dirs:
      - "~/Library/Containers/com.alibaba.DingTalkMac/Data/Documents"
    protected:
      - "*.db"
      - "*.sqlite"
      - "config"
      - "token"
      - "auth"
    risk_level: "data"

  - name: "QQ"
    bundle_id: "com.tencent.qq"
    process_name: "QQ"
    cache_dirs:
      - "~/Library/Containers/com.tencent.qq/Data/Library/Caches"
    data_dirs:
      - "~/Library/Containers/com.tencent.qq/Data/Documents"
    protected:
      - "*.db"
      - "*.sqlite"
      - "config"
    risk_level: "data"

  # === 浏览器 ===
  - name: "Google Chrome"
    bundle_id: "com.google.Chrome"
    process_name: "Google Chrome"
    cache_dirs:
      - "~/Library/Caches/Google/Chrome"
      - "~/Library/Application Support/Google/Chrome/Default/Cache"
      - "~/Library/Application Support/Google/Chrome/Default/Code Cache"
      - "~/Library/Application Support/Google/Chrome/Default/Service Worker"
    data_dirs:
      - "~/Library/Application Support/Google/Chrome/Default"
    protected:
      - "Bookmarks"
      - "Login Data"
      - "Web Data"
      - "Preferences"
      - "Extensions"
    risk_level: "cache"
    notes: "Service Worker 可以清理，但书签/密码/扩展必须保留"

  - name: "Microsoft Edge"
    bundle_id: "com.microsoft.edgemac"
    process_name: "Microsoft Edge"
    cache_dirs:
      - "~/Library/Caches/Microsoft Edge"
      - "~/Library/Application Support/Microsoft Edge/Default/Cache"
      - "~/Library/Application Support/Microsoft Edge/Default/Code Cache"
      - "~/Library/Application Support/Microsoft Edge/Default/Service Worker"
    data_dirs:
      - "~/Library/Application Support/Microsoft Edge/Default"
    protected:
      - "Bookmarks"
      - "Login Data"
      - "Web Data"
      - "Preferences"
      - "Extensions"
    risk_level: "cache"

  - name: "Safari"
    bundle_id: "com.apple.Safari"
    process_name: "Safari"
    cache_dirs:
      - "~/Library/Caches/com.apple.Safari"
      - "~/Library/Caches/com.apple.Safari/CacheStorage"
    data_dirs:
      - "~/Library/Safari"
    protected:
      - "Bookmarks.plist"
      - "History.db"
    risk_level: "cache"

  # === 开发工具 ===
  - name: "Visual Studio Code"
    bundle_id: "com.microsoft.VSCode"
    process_name: "Code"
    cache_dirs:
      - "~/Library/Application Support/Code/Cache"
      - "~/Library/Application Support/Code/CachedData"
      - "~/Library/Application Support/Code/CachedExtensions"
      - "~/Library/Application Support/Code/CachedProfileData"
    data_dirs:
      - "~/Library/Application Support/Code/User"
    protected:
      - "settings.json"
      - "keybindings.json"
      - "extensions"
    risk_level: "cache"
    notes: "缓存可以清理，但设置和扩展必须保留"

  - name: "Cursor"
    bundle_id: "com.todesktop.230313mzl4w4u92"
    process_name: "Cursor"
    cache_dirs:
      - "~/Library/Application Support/Cursor/Cache"
      - "~/Library/Application Support/Cursor/CachedData"
    data_dirs:
      - "~/Library/Application Support/Cursor/User"
    protected:
      - "settings.json"
      - "keybindings.json"
      - "extensions"
    risk_level: "cache"

  # === AI 助手 ===
  - name: "豆包"
    bundle_id: "com.larus.nova"
    process_name: "Doubao"
    cache_dirs:
      - "~/Library/Application Support/Doubao/Cache"
    data_dirs:
      - "~/Library/Application Support/Doubao"
    protected:
      - "*.db"
      - "config"
      - "token"
    risk_level: "data"
    notes: "用户每天都在用，谨慎处理"

  # === 容器和虚拟机 ===
  - name: "Docker Desktop"
    bundle_id: "com.docker.docker"
    process_name: "Docker"
    cache_dirs:
      - "~/Library/Containers/com.docker.docker/Data/Library/Caches"
    data_dirs:
      - "~/Library/Containers/com.docker.docker/Data"
    protected:
      - "settings.json"
    risk_level: "app"
    notes: "清理后需要重新拉取镜像"

  # === 包管理器 ===
  - name: "npm"
    cache_dirs:
      - "~/.npm"
    risk_level: "cache"

  - name: "pnpm"
    cache_dirs:
      - "~/Library/pnpm/store"
    risk_level: "cache"

  - name: "Homebrew"
    cache_dirs:
      - "~/Library/Caches/Homebrew"
    risk_level: "cache"

  - name: "pip"
    cache_dirs:
      - "~/Library/Caches/pip"
    risk_level: "cache"

# === 保护名单（全局）===
protected_patterns:
  # 授权和凭证
  - "**/keyrings/**"
  - "**/tokens/**"
  - "**/credentials/**"
  - "**/auth/**"
  - "**/.ssh/**"
  - "**/.gnupg/**"
  
  # 应用授权
  - "**/com.electron.lark/**/token*"
  - "**/com.alibaba.DingTalkMac/**/auth*"
  - "**/com.tencent.WeWorkMac/**/credentials*"
  
  # 密钥和证书
  - "**/*.key"
  - "**/*.pem"
  - "**/*.cert"
  - "**/*.p12"
  
  # 数据库文件
  - "**/*.db"
  - "**/*.sqlite"
  - "**/*.sqlite3"
  
  # 配置文件
  - "**/config.json"
  - "**/settings.json"
  - "**/preferences.plist"

# === 风险等级说明 ===
risk_levels:
  cache: "🟢 绝对安全，自动清理"
  app: "🟡 需要确认，清理后需要重新配置"
  data: "🔴 高风险，默认保留"
