# Broom Preferences Template
# This file is auto-generated by Broom during onboarding.
# You can also update preferences via natural language conversation.

schema_version: "1.0"

preferences:
  # Downloads cleanup thresholds (days)
  downloads_excel_age: 180
  downloads_ppt_age: 180
  downloads_zip_age: 90
  downloads_image_age: 90
  downloads_video_age: 90
  downloads_pdf_age: 180

  # Auto-clean settings
  cache_auto_clean: true          # Auto-clean 🟢 safe caches
  duplicate_auto_clean: true      # Auto-clean duplicate downloads

  # Periodic scan settings
  periodic_scan: "weekly"         # weekly | monthly | never
  periodic_day: "sunday"          # day of week (weekly) or date (monthly)
  periodic_time: "10:00"          # HH:MM format
  quiet_hours_start: "22:00"      # Don't send notifications during quiet hours
  quiet_hours_end: "08:00"

  # Large file scan thresholds (MB)
  large_file_threshold_normal: 500    # Disk < 80%
  large_file_threshold_elevated: 200  # Disk 80-90%
  large_file_threshold_critical: 100  # Disk > 90%

# User info (optional)
user:
  github_username: ""
  github_repo: ""

# Learned patterns (auto-updated by Broom)
learned:
  frequent_download_patterns: []
  usually_keeps_patterns: []
  usually_deletes_patterns: []
  always_keep_keywords: []
